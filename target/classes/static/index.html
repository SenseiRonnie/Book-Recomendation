<!doctype html><html><head><meta charset="utf-8"><title>Online Book Recommendation System</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:20px auto;padding:0 12px;color:#222}
nav button{margin:2px}.card{border:1px solid #ccc;border-radius:6px;padding:8px;margin:6px 0}
input,select{margin:2px;padding:4px}.row{display:flex;align-items:center;margin:4px 0}.row span{width:220px}
.bar{background:#3b82f6;color:#fff;padding:2px 6px;border-radius:3px;white-space:nowrap}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:4px;text-align:left}
</style></head><body>
<h2>Online Book Recommendation System</h2>
<div id="auth">
  <input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password (min 6)"><input id="e" placeholder="Email (register)">
  <button onclick="login()">Login</button><button onclick="register()">Register</button>
</div>
<div id="app" hidden>
  <p>Logged in as <b id="who"></b> <button onclick="logout()">Logout</button></p>
  <nav><button onclick="tab('books')">Books</button><button onclick="tab('friends')">Friends</button>
  <button onclick="tab('inbox')">Recommendations</button><button onclick="tab('chart')">Rating Chart</button>
  <button onclick="tab('profile')">Profile</button><button id="adminTab" onclick="tab('admin')">Admin</button></nav>
  <section class="tab" id="books"><input id="q" placeholder="Search by ISBN"><button onclick="tab('books')">Search</button><div id="booklist"></div></section>
  <section class="tab" id="friends" hidden><input id="fu" placeholder="Username"><button onclick="addFriend()">Send request</button>
    <h4>Incoming requests</h4><div id="reqs"></div><h4>Friends</h4><div id="flist"></div></section>
  <section class="tab" id="inbox" hidden></section>
  <section class="tab" id="chart" hidden></section>
  <section class="tab" id="profile" hidden><input id="pe" placeholder="Email"><button onclick="saveProfile()">Save</button></section>
  <section class="tab" id="admin" hidden>
    <h4>Add book</h4><input id="ai" placeholder="ISBN"><input id="at" placeholder="Title"><input id="aa" placeholder="Author">
    <input id="ap" placeholder="Publisher"><input id="ay" type="number" placeholder="Year"><button onclick="addBook()">Add</button>
    <h4>Users</h4><div id="ulist"></div><h4>Books</h4><div id="blist"></div></section>
</div>
<script>
let auth=sessionStorage.getItem('a'),me=null;
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function api(p,m='GET',b){
  const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(auth?{Authorization:auth}:{})},body:b?JSON.stringify(b):undefined});
  if(!r.ok){let t=r.statusText;try{t=(await r.json()).message||t}catch{}throw new Error(t)}
  const t=await r.text();return t?JSON.parse(t):null}
const run=f=>f().catch(e=>alert(e.message));
function login(){run(async()=>{auth='Basic '+btoa($('u').value+':'+$('p').value);
  try{me=await api('/me')}catch(e){auth=null;throw e}sessionStorage.setItem('a',auth);await start()})}
function register(){run(async()=>{await api('/auth/register','POST',{username:$('u').value,password:$('p').value,email:$('e').value});alert('Registered. Please log in.')})}
function logout(){sessionStorage.clear();location.reload()}
async function start(){me=me||await api('/me');$('auth').hidden=true;$('app').hidden=false;
  $('who').textContent=me.username;$('adminTab').hidden=me.role!=='ADMIN';$('pe').value=me.email||'';tab('books')}
const L={books:loadBooks,friends:loadFriends,inbox:loadInbox,chart:loadChart,admin:loadAdmin,profile:async()=>{}};
function tab(t){document.querySelectorAll('.tab').forEach(s=>s.hidden=s.id!==t);run(L[t])}
async function loadBooks(){const q=$('q').value.trim(),bs=(await api('/books')).filter(b=>!q||b.isbn.includes(q));
  $('booklist').innerHTML=bs.map(b=>`<div class="card"><b>${esc(b.title)}</b> by ${esc(b.author)}<br>${esc(b.publisher)}, ${esc(b.publishYear)} &middot; ISBN ${esc(b.isbn)}<br>
  <select id="s${esc(b.isbn)}">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select>
  <button onclick="rate('${esc(b.isbn)}')">Rate</button><button onclick="recommend('${esc(b.isbn)}')">Recommend to friend</button></div>`).join('')||'No books found'}
function rate(i){run(async()=>{await api(`/books/${i}/rate`,'POST',{stars:+$('s'+i).value});alert('Rated')})}
function recommend(i){const to=prompt('Friend username');if(!to)return;const c=prompt('Comment');
  run(async()=>{await api('/recommendations','POST',{toUser:to,isbn:i,comment:c});alert('Sent')})}
async function loadFriends(){const rq=await api('/friends/requests'),fl=await api('/friends');
  $('reqs').innerHTML=rq.map(r=>`<div class="card">${esc(r.requester)} <button onclick="accept(${r.id})">Accept</button></div>`).join('')||'None';
  $('flist').innerHTML=fl.map(f=>`<div class="card">${esc(f)}</div>`).join('')||'None'}
function addFriend(){run(async()=>{await api('/friends/request/'+encodeURIComponent($('fu').value),'POST');alert('Request sent')})}
function accept(id){run(async()=>{await api('/friends/accept/'+id,'POST');await loadFriends()})}
async function loadInbox(){const r=await api('/recommendations');
  $('inbox').innerHTML=r.map(x=>`<div class="card"><b>${esc(x.title)}</b> ${esc(x.author)} (ISBN ${esc(x.isbn)})<br>From <b>${esc(x.from)}</b>: ${esc(x.comment)}</div>`).join('')||'No recommendations yet'}
async function loadChart(){const s=await api('/ratings/summary');
  $('chart').innerHTML='<h4>Average rating per book (out of 5)</h4>'+(s.map(x=>`<div class="row"><span>${esc(x.title)}</span><div class="bar" style="width:${x.avg*20}%">${x.avg.toFixed(1)} (${x.count})</div></div>`).join('')||'No ratings yet')}
function saveProfile(){run(async()=>{me=await api('/me','PUT',{email:$('pe').value});alert('Saved')})}
async function loadAdmin(){const us=await api('/admin/users'),bs=await api('/books');
  $('ulist').innerHTML='<table><tr><th>ID</th><th>User</th><th>Email</th><th>Role</th><th></th></tr>'+us.map(u=>`<tr><td>${u.id}</td><td>${esc(u.username)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.role==='ADMIN'?'':`<button onclick="delUser(${u.id})">Delete</button>`}</td></tr>`).join('')+'</table>';
  $('blist').innerHTML=bs.map(b=>`<div class="card">${esc(b.title)} (${esc(b.isbn)}) <button onclick="delBook('${esc(b.isbn)}')">Delete</button></div>`).join('')}
function addBook(){run(async()=>{await api('/admin/books','POST',{isbn:$('ai').value,title:$('at').value,author:$('aa').value,publisher:$('ap').value,publishYear:+$('ay').value||null});await loadAdmin()})}
function delUser(id){if(confirm('Delete user?'))run(async()=>{await api('/admin/users/'+id,'DELETE');await loadAdmin()})}
function delBook(i){if(confirm('Delete book and its ratings?'))run(async()=>{await api('/admin/books/'+i,'DELETE');await loadAdmin()})}
if(auth)start().catch(()=>{sessionStorage.clear();auth=null});
</script></body></html>
